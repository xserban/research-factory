[project]
name = "factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "rapidfuzz>=3.10",
    "pypdf>=5",  # identifier sniffing only; not the converter (plan B)
    "markdown-it-py>=3",
    "lxml>=5",
    "bibtexparser>=1.4.1,<2",
]

[project.optional-dependencies]
# Optional converters. Never core dependencies. Decision 49 chose docling for PDF; pymupdf is
# not chosen and is kept only to try it.
docling = ["docling>=2.147.0"]  # MIT; layout models must be supplied (FACTORY_DOCLING_MODELS)
# Local embedding ranker (decision 116): SPECTER2 base, Apache-2.0; the weights must be supplied
# (FACTORY_RANKER_MODEL), never downloaded by the platform. Lazy imports, like docling.
ranker = ["transformers>=4.40", "torch>=2.2", "numpy>=1.26", "scikit-learn>=1.4"]
server = ["uvicorn>=0.30"]  # `factory serve --http`
pymupdf = ["pymupdf4llm>=2.1", "pymupdf>=1.24"]  # AGPL-3.0

[project.scripts]
factory = "factory.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-lxml",
    "pytest-xdist>=3.8.0",
    "import-linter>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not slow' --strict-markers"
markers = [
    "network: contacts external services",
    "slow: scale and acceptance suites and other long files; excluded by default, run at milestones with -m 'not network'",
    "browser: drives headless chromium on a built hub; skipped when chromium is absent",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["bibtexparser", "bibtexparser.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional extras (`ranker`: decision 116) are imported lazily and not installed in CI.
module = ["torch", "torch.*", "transformers", "transformers.*", "numpy", "numpy.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.coverage.run]
branch = true

# Architecture contracts (CLAUDE.md non-negotiable rules), checked by `lint-imports` in CI.
[tool.importlinter]
root_package = "factory"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The platform never calls a model: no model SDK is imported"
type = "forbidden"
source_modules = ["factory"]
forbidden_modules = [
    "anthropic", "openai", "mistralai", "cohere", "ollama", "groq",
    "langchain", "langchain_core", "langchain_community", "litellm",
    "llama_index", "vertexai",
]

[[tool.importlinter.contracts]]
name = "Interfaces never append events or project the index; services do"
type = "forbidden"
source_modules = ["factory.mcp", "factory.cli"]
forbidden_modules = ["factory.events.writer", "factory.index.projection"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The core never imports the interfaces (mcp, cli)"
type = "forbidden"
source_modules = [
    "factory.canonical", "factory.clock", "factory.config", "factory.errors",
    "factory.consolidation", "factory.document", "factory.events", "factory.evidence",
    "factory.exports", "factory.extraction", "factory.hypotheses", "factory.imports",
    "factory.inbox", "factory.index", "factory.intuition", "factory.lineage",
    "factory.living", "factory.mining", "factory.model", "factory.modules",
    "factory.packs", "factory.quality", "factory.references", "factory.regions",
    "factory.services", "factory.sources", "factory.views", "factory.writing",
]
forbidden_modules = ["factory.mcp", "factory.cli"]

[[tool.importlinter.contracts]]
name = "The MCP server does not depend on the CLI"
type = "forbidden"
source_modules = ["factory.mcp"]
forbidden_modules = ["factory.cli"]

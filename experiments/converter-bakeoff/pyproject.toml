[project]
name = "converter-bakeoff"
version = "0.0.0"
description = "Converter bake-off for slice 2 plan B1 (experiment, outside platform/)"
requires-python = ">=3.11"
dependencies = [
    "docling==2.146.0",
    "factory",
    "httpx>=0.27",
    "pymupdf4llm==2.1",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.sources]
factory = { path = "../../platform" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

# Weekly, grouped, small pull-request limit. Dependabot pull requests are reviewed like any change;
# none merges automatically. Optional extras are part of platform/pyproject.toml and so included.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/platform"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    # bibtexparser stays on 1.x (slice 3d ruling 18: the entry hash depends on its serialisation);
    # docling is the chosen PDF converter (decision 49) and a new version changes the converter
    # fingerprint recorded on every conversion, so it is bumped by hand with a re-conversion plan.
    ignore:
      - dependency-name: "bibtexparser"
      - dependency-name: "docling"
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

# SonarQube Cloud configuration (free for public repositories).
# The project key and organization must match those shown in SonarQube Cloud
# after importing the repository; adjust them there if they differ.
sonar.projectKey=xserban_research-factory
sonar.organization=xserban
sonar.projectName=Research Factory

sonar.sources=platform/src,scripts
sonar.tests=platform/tests
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Experiments are prototypes (exempt from platform rules); plugin holds skill text.
sonar.exclusions=experiments/**,plugin/**,data/**,docs/**
